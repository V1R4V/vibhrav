name: Portfolio checks

on:
  pull_request:
  push:
    branches: [main, feat/cinematic-portfolio]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install local integration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          npx playwright install --with-deps chrome
      - name: Lint
        run: npm run lint
      - name: Contact unit and real Redis integration tests
        run: npm run test:contact
      - name: Production build
        run: npm run build
      - name: Type check including generated route types
        run: npm run typecheck
      - name: Browser and accessibility checks
        run: npm run test:browser
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-browser-failures
          path: .artifacts/playwright
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
