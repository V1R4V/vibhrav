<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stock data streaming pipeline cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071021"/>
      <stop offset="100%" stop-color="#0e3150"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.07"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="190" fill="#22d3ee" opacity="0.16"/>
  <circle cx="150" cy="640" r="220" fill="#38bdf8" opacity="0.1"/>

  <rect x="90" y="120" width="1020" height="510" rx="34" fill="url(#card)" stroke="#67e8f9" stroke-opacity="0.3"/>

  <text x="140" y="210" fill="#e4f8ff" font-size="46" font-family="Arial, Helvetica, sans-serif" font-weight="700">Real-Time Stock Data Streaming Pipeline</text>
  <text x="140" y="258" fill="#b9e7f5" font-size="28" font-family="Arial, Helvetica, sans-serif">MySQL to Kafka to HDFS with exactly-once style batch persistence</text>

  <rect x="140" y="335" width="180" height="98" rx="18" fill="#10253a" stroke="#7dd3fc" stroke-opacity="0.35"/>
  <text x="230" y="392" text-anchor="middle" fill="#def7ff" font-size="22" font-family="Arial, Helvetica, sans-serif">Price Feed</text>

  <rect x="390" y="335" width="150" height="98" rx="18" fill="#10253a" stroke="#7dd3fc" stroke-opacity="0.35"/>
  <text x="465" y="392" text-anchor="middle" fill="#def7ff" font-size="22" font-family="Arial, Helvetica, sans-serif">MySQL</text>

  <rect x="610" y="300" width="250" height="168" rx="24" fill="#10253a" stroke="#7dd3fc" stroke-opacity="0.35"/>
  <text x="735" y="348" text-anchor="middle" fill="#def7ff" font-size="23" font-family="Arial, Helvetica, sans-serif">Kafka Broker</text>
  <rect x="662" y="369" width="145" height="36" rx="10" fill="#16314a"/>
  <text x="735" y="393" text-anchor="middle" fill="#ccefff" font-size="16" font-family="Arial, Helvetica, sans-serif">stock_prices</text>
  <rect x="662" y="414" width="145" height="36" rx="10" fill="#16314a"/>
  <text x="735" y="438" text-anchor="middle" fill="#ccefff" font-size="16" font-family="Arial, Helvetica, sans-serif">partitions</text>

  <rect x="930" y="335" width="130" height="98" rx="18" fill="#10253a" stroke="#7dd3fc" stroke-opacity="0.35"/>
  <text x="995" y="392" text-anchor="middle" fill="#def7ff" font-size="22" font-family="Arial, Helvetica, sans-serif">HDFS</text>

  <line x1="320" y1="384" x2="390" y2="384" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="540" y1="384" x2="610" y2="384" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="860" y1="384" x2="930" y2="384" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="140" y="500" width="920" height="70" rx="14" fill="#0f2235" stroke="#67e8f9" stroke-opacity="0.24"/>
  <text x="175" y="544" fill="#d5f5ff" font-size="21" font-family="Arial, Helvetica, sans-serif">Checkpoint recovery, partitioned Parquet output, and high-throughput ingestion flow</text>
</svg>
