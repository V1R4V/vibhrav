<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="House price predictor ML workflow cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b3b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect x="95" y="95" width="1010" height="560" rx="30" fill="#10202d" stroke="#67e8f9" stroke-opacity="0.3"/>

  <text x="145" y="192" fill="#e6fbff" font-size="46" font-family="Arial, Helvetica, sans-serif" font-weight="700">House Price Predictor</text>
  <text x="145" y="245" fill="#bdeff6" font-size="29" font-family="Arial, Helvetica, sans-serif">Compare linear models, ensembles, and boosting on real estate data</text>

  <line x1="165" y1="500" x2="540" y2="500" stroke="#7dd3fc" stroke-width="3"/>
  <line x1="165" y1="500" x2="165" y2="320" stroke="#7dd3fc" stroke-width="3"/>

  <polyline points="170,485 240,450 310,460 380,400 450,360 520,335" fill="none" stroke="#22d3ee" stroke-width="5"/>
  <circle cx="240" cy="450" r="6" fill="#67e8f9"/>
  <circle cx="310" cy="460" r="6" fill="#67e8f9"/>
  <circle cx="380" cy="400" r="6" fill="#67e8f9"/>
  <circle cx="450" cy="360" r="6" fill="#67e8f9"/>
  <circle cx="520" cy="335" r="6" fill="#67e8f9"/>

  <rect x="630" y="310" width="390" height="255" rx="18" fill="#0f2a3a" stroke="#7dd3fc" stroke-opacity="0.32"/>
  <text x="660" y="360" fill="#d6f9ff" font-size="24" font-family="Arial, Helvetica, sans-serif">Best test performance:</text>
  <text x="660" y="400" fill="#bbf7ff" font-size="23" font-family="Arial, Helvetica, sans-serif">XGBoost  RMSE: 5.879</text>
  <text x="660" y="436" fill="#bbf7ff" font-size="23" font-family="Arial, Helvetica, sans-serif">XGBoost  R2: 0.794</text>
  <text x="660" y="486" fill="#a7e7f2" font-size="20" font-family="Arial, Helvetica, sans-serif">Compared: Linear, Ridge, Lasso, RF, XGBoost</text>
  <text x="660" y="520" fill="#a7e7f2" font-size="20" font-family="Arial, Helvetica, sans-serif">Features: MRT distance, stores, lat, long</text>

  <rect x="145" y="565" width="140" height="44" rx="22" fill="#0e7490"/>
  <text x="180" y="594" fill="#e1fbff" font-size="20" font-family="Arial, Helvetica, sans-serif">XGBoost</text>
  <rect x="300" y="565" width="180" height="44" rx="22" fill="#155e75"/>
  <text x="341" y="594" fill="#e1fbff" font-size="20" font-family="Arial, Helvetica, sans-serif">RandomForest</text>
  <rect x="495" y="565" width="120" height="44" rx="22" fill="#0f766e"/>
  <text x="534" y="594" fill="#e1fbff" font-size="20" font-family="Arial, Helvetica, sans-serif">Ridge</text>
</svg>
