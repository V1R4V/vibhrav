<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distributed weather system cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1023"/>
      <stop offset="100%" stop-color="#1f1750"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.08"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1030" cy="100" r="190" fill="#a78bfa" opacity="0.2"/>
  <circle cx="130" cy="650" r="220" fill="#60a5fa" opacity="0.12"/>

  <rect x="90" y="120" width="1020" height="510" rx="34" fill="url(#card)" stroke="#c4b5fd" stroke-opacity="0.28"/>

  <text x="140" y="210" fill="#efe9ff" font-size="46" font-family="Arial, Helvetica, sans-serif" font-weight="700">Distributed Weather Data with Cassandra</text>
  <text x="140" y="258" fill="#d9d0ff" font-size="28" font-family="Arial, Helvetica, sans-serif">NOAA streams, tunable consistency, and failover-friendly query serving</text>

  <rect x="140" y="345" width="190" height="95" rx="18" fill="#1c2350" stroke="#c4b5fd" stroke-opacity="0.34"/>
  <text x="235" y="400" text-anchor="middle" fill="#f1ecff" font-size="22" font-family="Arial, Helvetica, sans-serif">NOAA Feed</text>

  <rect x="390" y="300" width="430" height="185" rx="26" fill="#1c2350" stroke="#c4b5fd" stroke-opacity="0.34"/>
  <text x="605" y="344" text-anchor="middle" fill="#f1ecff" font-size="24" font-family="Arial, Helvetica, sans-serif">Cassandra Cluster</text>
  <circle cx="520" cy="406" r="42" fill="#28326c"/>
  <circle cx="605" cy="381" r="42" fill="#28326c"/>
  <circle cx="690" cy="406" r="42" fill="#28326c"/>
  <text x="520" y="412" text-anchor="middle" fill="#ddd6fe" font-size="14" font-family="Arial, Helvetica, sans-serif">Node A</text>
  <text x="605" y="387" text-anchor="middle" fill="#ddd6fe" font-size="14" font-family="Arial, Helvetica, sans-serif">Node B</text>
  <text x="690" y="412" text-anchor="middle" fill="#ddd6fe" font-size="14" font-family="Arial, Helvetica, sans-serif">Node C</text>

  <rect x="880" y="345" width="180" height="95" rx="18" fill="#1c2350" stroke="#c4b5fd" stroke-opacity="0.34"/>
  <text x="970" y="400" text-anchor="middle" fill="#f1ecff" font-size="22" font-family="Arial, Helvetica, sans-serif">Analytics API</text>

  <line x1="330" y1="392" x2="390" y2="392" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="820" y1="392" x2="880" y2="392" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="140" y="505" width="920" height="70" rx="14" fill="#1a2148" stroke="#c4b5fd" stroke-opacity="0.22"/>
  <text x="175" y="549" fill="#e9e4ff" font-size="21" font-family="Arial, Helvetica, sans-serif">Consistency-level control + automatic node-failure handling keeps the system highly available</text>
</svg>
